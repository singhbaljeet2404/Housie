[build]
  # Netlify sets $URL to the site's primary URL; NEXT_PUBLIC_SITE_URL in the UI overrides it.
  command = "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-$URL} npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime (SSR, route handlers, server actions → Netlify Functions).
# Declared explicitly because upload deploys don't always auto-detect it; Netlify supplies the latest version.
[[plugins]]
  package = "@netlify/plugin-nextjs"
